[package]
name = "streamy-desktop"
version = "0.1.0"
description = "Winamp-style desktop broadcaster for Shoutcast v2"
authors = ["Streamy Dev"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "streamy_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
symphonia = { version = "0.5", features = ["wav", "mp3", "flac", "ogg", "vorbis", "aac"] }
rtrb = "0.3"
cpal = "0.15"
lofty = "0.22"
rayon = "1"
