[package]
name = "streamy-desktop"
version = "1.5.1"
description = "Winamp-style desktop broadcaster for Shoutcast v2"
authors = ["Streamy Dev"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "streamy_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }
cc = "1"

[features]
default = ["aac"]
aac = ["fdk-aac"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
parking_lot = "0.12"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
symphonia = { version = "0.5", features = ["wav", "mp3", "flac", "ogg", "vorbis", "aac"] }
rtrb = "0.3"
cpal = "0.15"
lofty = "0.22"
rayon = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
fdk-aac = { version = "0.8", optional = true }
crossbeam-queue = "0.3.14"
nnnoiseless = { version = "0.5", default-features = false }
tauri-plugin-opener = "2.5.5"
