name: build-windows

# Builds the Streamy Desktop Tauri app for Windows on every push (any branch),
# on version tags, and on manual dispatch. Uploads the .msi / NSIS installer
# and the raw .exe as a workflow artifact you can download and run on a
# Windows box without building locally.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # The audit found 3 Windows-only defects invisible on Linux (rename
      # ACCESS_DENIED, create ACCESS_DENIED, first-run false-WARN) — all
      # proven reproducible only on Windows/Wine. Run the suite on real
      # Windows before shipping a build.
      - name: cargo test (Windows)
        working-directory: src-tauri
        run: cargo test --locked

      - name: Set build version (major.minor.<run_number>)
        shell: pwsh
        run: |
          # Base version lives in Cargo.toml (e.g. "1.1.0"). Each CI build
          # stamps the patch with the run number so every .exe is unique and
          # monotonically increasing (1.1.47, 1.1.48, ...). Repo stays 1.1.0;
          # nothing is committed back.
          $line = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(\d+)\.(\d+)\.'
          $major = $line.Matches.Groups[1].Value
          $minor = $line.Matches.Groups[2].Value
          $ver = "$major.$minor.${{ github.run_number }}"
          Write-Host "Build version: $ver"
          (Get-Content src-tauri/Cargo.toml) `
            -replace '^version = ".*"', "version = `"$ver`"" |
            Set-Content src-tauri/Cargo.toml
          (Get-Content src-tauri/tauri.conf.json) `
            -replace '"version":\s*"[^"]*"', "`"version`": `"$ver`"" |
            Set-Content src-tauri/tauri.conf.json
          (Get-Content package.json) `
            -replace '"version":\s*"[^"]*"', "`"version`": `"$ver`"" |
            Set-Content package.json

      - name: Build Tauri app (.msi + .exe)
        run: npm run tauri build

      - name: Upload installers + exe
        uses: actions/upload-artifact@v4
        with:
          name: streamy-desktop-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.exe

  # Publish a GitHub Release on version tags so the app's update check
  # (Cloudflare Worker proxy -> releases/latest) has something to report.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: streamy-desktop-windows
          path: dist-artifact
      - name: Create release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "Streamy Desktop ${TAG#v}" \
            --generate-notes \
            dist-artifact/**/bundle/nsis/*.exe \
            dist-artifact/**/bundle/msi/*.msi
